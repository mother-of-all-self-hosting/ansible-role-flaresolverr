---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: flaresolverr-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        flaresolverr_debug_service_enabled: false

        # Where prepare.yml puts the files verify.yml needs on the host: the
        # marker file the role bind-mounts into the container, and the document
        # root of the sidecar web server the browser is pointed at.
        flaresolverr_molecule_path: /opt/molecule-flaresolverr

        # Variables for FlareSolverr
        flaresolverr_uid: 1000
        flaresolverr_gid: 1000
        flaresolverr_hostname: localhost
        flaresolverr_container_labels_traefik_enabled: false

        # Deliberately not FlareSolverr's own default of 8191. The port the
        # process listens on reaches it only through PORT in the env file this
        # role renders, so every HTTP check in verify.yml fails if the role's
        # configuration did not arrive - an instance the role did not configure
        # would still be on 8191 and nothing would answer here.
        flaresolverr_container_http_port: 8291
        flaresolverr_container_http_host_bind_port: 8291

        # Likewise not the role's default of UTC, so that the timezone verify.yml
        # reads back out of the container can only have come from the env file.
        flaresolverr_environment_variables_tz: Asia/Tokyo

        # `flaresolverr_container_additional_volumes` is documented as a way to
        # mount your own files into the container, which is only true for as long
        # as the systemd unit template keeps rendering it. verify.yml checks that
        # this mount really reached the container.
        flaresolverr_container_additional_volumes_custom:
          - type: bind
            src: "{{ flaresolverr_molecule_path }}/marker"
            dst: /config/molecule-marker
            options: readonly
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
